services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: finbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finbridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finbridge_pass}
      POSTGRES_DB: ${POSTGRES_DB:-finbridge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbridge_user -d finbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finbridge-network

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Store (Sessions, Cache, Celery Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finbridge-network

  # ----------------------------------------------------------------------------
  # Backend FastAPI Application
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: finbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://finbridge_user:finbridge_pass@postgres:5432/finbridge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=docker-compose-dev-secret-key-32-chars-long!!
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - finbridge-network

  # ----------------------------------------------------------------------------
  # Frontend React (Vite) Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: finbridge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - finbridge-network

networks:
  finbridge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
